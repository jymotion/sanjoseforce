name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py is standard library only, so there is nothing to install.
      - name: Build the site
        run: python3 build.py

      # Publish everything the build emits, minus the sources. Listing what to
      # copy meant a new output directory silently went missing; listing what to
      # leave behind fails safe instead.
      - name: Stage the publishable files
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'pages' \
            --exclude 'build.py' \
            --exclude 'serve.py' \
            --exclude 'README.md' \
            --exclude '__pycache__' \
            --exclude '.build-manifest.json' \
            --exclude '.build-backups'
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"
          echo "news/ contains $(ls _site/news | wc -l) files"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
